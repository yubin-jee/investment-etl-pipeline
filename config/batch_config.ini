[paths]
; OS-agnostic data directories (replaces the old C:\MeridianData network drive).
; Relative paths resolve against the repo root; absolute paths are honored as-is.
; Override any value with the matching env var (MERIDIAN_DATA_DIR / MERIDIAN_REPORT_DIR / MERIDIAN_LOG_DIR).
; In containers these map to the mounted named volume (see docker-compose.yml).
data_dir = legacy_data
report_dir = reports
log_dir = logs

[database]
; SQL Server connection. In containers this points at the "sqlserver" service.
; Override via env: MSSQL_HOST, MSSQL_PORT, MSSQL_DB, MSSQL_USER.
; The password is sourced from MSSQL_SA_PASSWORD - never store secrets here.
host = sqlserver
port = 1433
database = MeridianOMS
user = sa

[email]
; SMTP settings for error notifications (override via env: SMTP_HOST, SMTP_PORT, SMTP_FROM).
smtp_server = mail.meridian-capital.com
smtp_port = 25
from_address = batch@meridian-capital.com
error_recipients = sandra.ops@meridian-capital.com,dave.ops@meridian-capital.com

[schedule]
; Cron expressions (replaces Windows Task Scheduler). Times are in the container's
; timezone (set TZ in .env, e.g. America/New_York). Weekdays only (Mon-Fri).
; See deploy/crontab for a ready-to-use crontab.
daily_batch = 30 6 * * 1-5
trade_processing = 30 6 * * 1-5
nav_calculation = 45 6 * * 1-5
reconciliation = 0 7 * * 1-5
compliance = 15 7 * * 1-5
client_reports = 0 8 * * 1-5

[tolerances]
recon_tolerance_usd = 1.00
price_stale_hours = 18
max_trade_errors = 50
